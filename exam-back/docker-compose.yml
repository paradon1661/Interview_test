# Local dependencies only. The API runs with `dotnet run` against these.
services:
  postgres:
    image: postgres:17-alpine
    container_name: exam-postgres
    environment:
      POSTGRES_DB: exam
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam_dev
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
